<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="UniCareer — вакансии, резюме и трудоустройство выпускников IT-специальностей"
    />
    <title>UniCareer — Платформа карьеры IT-выпускников</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>
    <style>
      :root {
        --navy: #0f1e36;
        --navy2: #16294a;
        --blue: #2856c5;
        --blue2: #2f63c9;
        --violet: #5547d8;
        --violet2: #7b6cf3;
        --pale: #f4f5fa;
        --line: #e2e7f0;
        --text: #17243b;
        --muted: #6b7890;
        --green: #168047;
        --orange: #b97613;
        --red: #c94343;
        --shadow: 0 2px 12px rgba(18, 38, 74, 0.05);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--pale);
        color: var(--text);
        font:
          14px/1.55 Inter,
          Segoe UI,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .ic {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        stroke-width: 1.9;
      }
      .top {
        height: 60px;
        background: var(--navy);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 max(24px, calc((100vw - 1280px) / 2));
        position: sticky;
        top: 0;
        z-index: 30;
        box-shadow: 0 2px 12px rgba(9, 20, 40, 0.16);
      }
      .logo {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -1px;
        white-space: nowrap;
        color: #fff;
      }
      .nav {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .nav a {
        font-size: 11px;
        font-weight: 600;
        color: #dbe4f5;
        opacity: 0.9;
        white-space: nowrap;
      }
      .nav a:hover {
        opacity: 1;
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .userbar {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .userchip {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
        border-radius: 7px;
        padding: 3px 5px;
      }
      .userchip:hover {
        background: #ffffff14;
      }
      .userchip .ic {
        width: 12px;
        height: 12px;
        opacity: 0.8;
      }
      .avatar {
        width: 29px;
        height: 29px;
        border-radius: 50%;
        background: #e6ebf3;
        color: #94a2b8;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        overflow: hidden;
      }
      .avatar .ic {
        width: 18px;
        height: 18px;
        color: #94a2b8;
      }
      .iconbtn {
        background: transparent;
        border: 0;
        color: #dbe4f5;
        padding: 5px;
        display: flex;
        border-radius: 7px;
      }
      .iconbtn:hover {
        background: #ffffff1a;
        color: #fff;
      }
      .iconbtn .ic {
        width: 15px;
        height: 15px;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        padding: 9px 15px;
        font-weight: 700;
        color: var(--text);
        transition:
          background 0.16s,
          border-color 0.16s,
          transform 0.16s,
          box-shadow 0.16s;
      }
      .btn:hover {
        border-color: #a9b8df;
        background: #f8faff;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn.primary {
        background: linear-gradient(100deg, #5142d1, #6a58e8);
        border-color: #5142d1;
        color: #fff;
        box-shadow: 0 3px 10px rgba(85, 71, 216, 0.2);
      }
      .btn.primary:hover {
        background: #4636c2;
        border-color: #4636c2;
      }
      .btn.dark {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .btn.small {
        padding: 6px 11px;
        font-size: 11px;
      }
      .btn.ghost {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.55);
        color: #fff;
      }
      .btn.ghost:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: #fff;
      }
      .btn.wide {
        width: 100%;
        padding: 12px;
        font-size: 14px;
      }
      .btn.danger {
        color: #c94343;
        border-color: #f0c9c9;
        background: #fff;
      }
      .btn.danger:hover {
        background: #fff5f5;
        border-color: #e2352c;
        color: #e2352c;
      }
      .wrap {
        max-width: 1280px;
        margin: 24px auto;
        padding: 0 24px;
      }
      .layout {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        gap: 0;
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: 84px;
        border-right: 1px solid var(--line);
        padding: 10px 20px 24px 0;
        background: transparent;
      }
      .sidebar h4 {
        display: none;
      }
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 13px;
        margin: 3px 0;
        border-radius: 8px;
        color: #5b677e;
        font-size: 12px;
        font-weight: 600;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .sidebar a .ic {
        width: 16px;
        height: 16px;
        color: #8b98b0;
      }
      .sidebar a:hover {
        background: #eae9ff;
        color: #4a3cc4;
      }
      .sidebar a:hover .ic {
        color: #5547d8;
      }
      .sidebar a.active {
        background: #e9e8ff;
        color: #4a3cc4;
        font-weight: 800;
      }
      .sidebar a.active .ic {
        color: #2856c5;
      }
      section.main {
        padding-left: 26px;
        min-width: 0;
      }
      .panel,
      .job,
      .stat,
      .formbox {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .panel {
        padding: 22px;
        margin-bottom: 16px;
      }
      .panel h2 {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.4px;
        margin: 0 0 14px;
      }
      .panel h3 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }
      .heading h1 {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.8px;
        margin: 0;
      }
      .subtitle {
        color: var(--muted);
        font-size: 12px;
        margin: -10px 0 20px;
      }
      .muted {
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .stat {
        padding: 18px;
      }
      .stat strong {
        display: block;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--text);
        line-height: 1.2;
      }
      .stat strong.green {
        color: var(--green);
      }
      .stat strong.navy {
        color: #1b3a6b;
      }
      .stat span {
        font-size: 11px;
        color: var(--muted);
        display: block;
        line-height: 1.4;
      }
      .hero {
        position: relative;
        overflow: hidden;
        min-height: 395px;
        border-radius: 12px;
        padding: 52px 48px;
        color: #fff;
        background:
          linear-gradient(
            100deg,
            rgba(11, 27, 50, 0.96) 0%,
            rgba(13, 33, 62, 0.88) 38%,
            rgba(18, 49, 87, 0.45) 70%,
            rgba(18, 49, 87, 0.08) 100%
          ),
          url("https://images.pexels.com/photos/33719788/pexels-photo-33719788.jpeg?auto=compress&cs=tinysrgb&w=1600")
            center/cover;
        box-shadow: 0 8px 26px rgba(17, 33, 61, 0.16);
      }
      .hero-art {
        display: block;
        position: absolute;
        right: 8px;
        bottom: 6px;
        width: 32%;
        opacity: 0.28;
        pointer-events: none;
      }
      .formbox {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .notice {
        background: #f1efff;
        border-left: 3px solid #6452df;
        padding: 12px 15px;
        border-radius: 7px;
        font-size: 12px;
        color: #4a3f9e;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .progress i {
        flex: 1;
        height: 6px;
        border-radius: 20px;
        background: #e9edf4;
        overflow: hidden;
        position: relative;
        display: block;
      }
      .progress i:after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--pct, 70%);
        background: #2856c5;
        border-radius: 20px;
      }
      .timeline {
        border-left: 2px solid #e3e7f0;
        margin-left: 8px;
        padding-left: 20px;
      }
      .timeline > div {
        position: relative;
        padding-bottom: 18px;
      }
      .timeline > div:before {
        content: "";
        position: absolute;
        left: -27px;
        top: 5px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #2856c5;
        box-shadow: 0 0 0 3px #e8efff;
      }
      .timeline b {
        font-size: 13px;
      }
      .timeline p {
        margin: 3px 0;
        font-size: 12px;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 22px;
        height: 170px;
        padding: 10px 4px 0;
      }
      .bars > div {
        flex: 1;
        text-align: center;
      }
      .bars b {
        display: block;
        margin: 0 auto 8px;
        width: 60%;
        max-width: 54px;
        border-radius: 6px 6px 0 0;
        background: linear-gradient(#8fa9ef, #2856c5);
        min-height: 6px;
      }
      .bars small {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.35;
        display: block;
      }
      .hero > h1,
      .hero > p,
      .hero > .btn,
      .heroStats {
        position: relative;
        z-index: 1;
      }
      .hero h1 {
        font-size: 35px;
        line-height: 1.16;
        letter-spacing: -1.2px;
        max-width: 520px;
        margin: 0 0 16px;
      }
      .hero p {
        max-width: 460px;
        color: #e2ebfa;
        font-size: 14px;
        margin: 0 0 26px;
      }
      .hero .btn {
        margin-right: 10px;
      }
      .hero .btn.ghost {
        border-color: rgba(255, 255, 255, 0.65);
      }
      .heroStats {
        display: flex;
        gap: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 18px;
        margin-top: 36px;
        max-width: 640px;
      }
      .heroStats .hs {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 28px;
        border-right: 1px solid rgba(255, 255, 255, 0.16);
      }
      .heroStats .hs:first-child {
        padding-left: 0;
      }
      .heroStats .hs:last-child {
        border-right: 0;
      }
      .heroStats .hs > .ic {
        width: 22px;
        height: 22px;
        color: #fff;
      }
      .heroStats b {
        display: block;
        font-size: 19px;
        font-weight: 800;
        line-height: 1.2;
      }
      .heroStats small {
        font-size: 10px;
        color: #cbd8ee;
      }
      .job {
        padding: 16px 18px;
        margin-bottom: 11px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .job:hover {
        border-color: #b9b0f2;
        box-shadow: 0 6px 18px rgba(85, 71, 216, 0.09);
      }
      .jobtop {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }
      .jtitle {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }
      .job h3 {
        font-size: 14px;
        font-weight: 800;
        margin: 0 0 2px;
      }
      .job .salary {
        font-size: 14px;
        font-weight: 800;
        color: var(--text);
        white-space: nowrap;
      }
      .jright {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .heart {
        width: 31px;
        height: 31px;
        border: 1px solid var(--line);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #98a4b8;
        background: #fff;
        padding: 0;
      }
      .heart .ic {
        width: 16px;
        height: 16px;
      }
      .heart:hover,
      .heart.active {
        color: #e2352c;
        border-color: #f0b8b5;
        background: #fff5f5;
      }
      .heart.active .ic {
        fill: currentColor;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      .pill {
        display: inline-block;
        background: #eef1f6;
        color: #66738b;
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 10px;
        font-weight: 700;
      }
      .pill.green {
        background: #e3f6ea;
        color: var(--green);
      }
      .pill.orange {
        background: #fff1dc;
        color: var(--orange);
      }
      .pill.blue {
        background: #e6efff;
        color: #2459c5;
      }
      .pill.violet {
        background: #ebe8ff;
        color: #5547d8;
      }
      .pill.red {
        background: #fdeaea;
        color: var(--red);
      }
      .clogo {
        width: 42px;
        height: 42px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
        flex: 0 0 auto;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
      }
      .clogo.red {
        background: #e2352c;
      }
      .clogo.green {
        background: #0f9d58;
      }
      .clogo.yellow {
        background: linear-gradient(135deg, #151515 0 48%, #ffd400 48%);
        color: #ffd400;
      }
      .clogo.blue {
        background: #1e4fa3;
      }
      .clogo.purple {
        background: #5b49da;
      }
      .clogo.lg {
        width: 52px;
        height: 52px;
        font-size: 24px;
        border-radius: 10px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 18px;
        padding: 7px 14px;
        font-size: 11px;
        font-weight: 700;
        color: #5b677e;
      }
      .tabs button.active {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .auth .tabs button {
        flex: 1;
        text-align: center;
        border-radius: 8px;
        padding: 9px 12px;
      }
      .progress-card2 {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #eef1ff;
        border: 1px solid #dfe5ff;
        border-radius: 10px;
        padding: 14px 18px;
        margin: 16px 0;
      }
      .pcircle {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid #2f63c9;
        color: #2f63c9;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .pcircle .ic {
        width: 17px;
        height: 17px;
      }
      .pinfo {
        flex: 1;
        min-width: 0;
      }
      .pinfo b {
        font-size: 13px;
        display: block;
        margin-bottom: 8px;
      }
      .progress-track {
        height: 7px;
        border-radius: 20px;
        background: #d9e1f3;
        overflow: hidden;
      }
      .progress-track i {
        display: block;
        height: 100%;
        border-radius: 20px;
        background: #2f63c9;
      }
      .progress-track.green {
        background: #e0ece6;
      }
      .progress-track.green i {
        background: #21a15a;
      }
      .plink {
        color: #4a3cc4;
        font-size: 12px;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
        white-space: nowrap;
      }
      .rec-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .rec-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 15px;
        min-height: 104px;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .rec-card:hover {
        border-color: #b9b0f2;
        box-shadow: 0 6px 18px rgba(85, 71, 216, 0.09);
      }
      .rec-card b {
        display: block;
        font-size: 13px;
        line-height: 1.35;
      }
      .rec-card span {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .rec-card strong {
        display: block;
        font-size: 14px;
        margin-top: 13px;
      }
      .person {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .person .avatar {
        width: 58px;
        height: 58px;
      }
      .person .avatar .ic {
        width: 34px;
        height: 34px;
      }
      .person h3 {
        margin: 0 0 3px;
        font-size: 16px;
      }
      .person .p-pos {
        color: var(--muted);
        font-size: 12px;
      }
      .person p {
        margin: 6px 0 0;
        font-size: 12px;
        color: #46536b;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .person p .ic {
        width: 14px;
        height: 14px;
        color: #8b98b0;
      }
      .checklist {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .checklist li {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: #46536b;
      }
      .checklist .ic {
        width: 16px;
        height: 16px;
        color: #9aa5b8;
      }
      .checklist li.done .ic {
        color: #21a15a;
      }
      .input-icon {
        display: flex;
        align-items: center;
        gap: 9px;
        border: 1px solid #dfe4ee;
        background: #fff;
        border-radius: 8px;
        padding: 0 12px;
        color: #9aa5b8;
      }
      .input-icon .ic {
        width: 16px;
        height: 16px;
      }
      .input-icon input,
      .input-icon select {
        border: 0;
        outline: 0;
        background: transparent;
        padding: 11px 0;
        flex: 1;
        min-width: 0;
        color: var(--text);
        box-shadow: none !important;
      }
      .input-icon:focus-within {
        border-color: #6a58e8;
        box-shadow: 0 0 0 3px rgba(106, 88, 232, 0.12);
      }
      .field {
        margin-bottom: 13px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #48546a;
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea {
        border: 1px solid #dfe4ee;
        background: #fff;
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text);
        outline: none;
        width: 100%;
      }
      .field textarea {
        min-height: 92px;
        resize: vertical;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: #6a58e8;
        box-shadow: 0 0 0 3px rgba(106, 88, 232, 0.12);
      }
      .formgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;

        db.jobs.forEach((j) => {
          const title = String(j.title || "");

            j.grade = "Junior";

          if (j.area === "DevOps" || title.includes("DevOps")) {
            j.grade = "Junior";
            j.area = "DevOps";
            j.title = title
              .replace(/\s*\(Intern\)/i, " (Junior)")
              .replace(/^DevOps\s+Intern$/i, "DevOps Engineer (Junior)");
          }
        });

        localStorage.setItem("unicareer_v3", JSON.stringify(db));

        persistLocal();
        const shared = {
          ...db,
          current: null,
          selectedJob: undefined,
          selectedCandidate: undefined,
        };
        const payload = JSON.stringify(shared);
        saveQueue = saveQueue
          .catch(() => {})
          .then(() =>
            fetch("/api/state", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: payload,
            }).then((r) => {
              if (!r.ok) throw Error("HTTP " + r.status);

        return saveQueue;

        render();
      }
      function yearOf(s) {
        const m = String(s || "").match(/20\d{2}/);
        return m ? m[0] : "2025";
      }
      function analytics() {
        const allNames = [
          "Разработка ПО",
          "Data Science",
          "DevOps",
          "Тестирование (QA)",
        ];
        const years = [
          ...new Set([
            "2025",
            "2024",
            "2023",
            ...db.employment.map((e) => yearOf(e.start)),
          ]),
        ]
          .sort()
          .reverse();
        const year = years.includes(window.anaYear) ? window.anaYear : "2025";
        const dir = window.anaDir || "IT";
        const dirs = ["IT", ...allNames];
        const grads = db.users.filter((x) => x.role === "graduate");
        const employed = grads.filter((u) =>
          db.employment.some(
            (e) => e.user === u.id && yearOf(e.start) === year,
          ),
        ).length;
        const rate = grads.length
          ? Math.round((employed / grads.length) * 100)
          : 0;
        const searchPct = grads.length
          ? Math.round(((grads.length - employed) / grads.length) * 100)
          : 100;
        const undecidedPct = Math.max(0, 100 - rate - searchPct);
        const names = dir === "IT" ? allNames : [dir];
        const pcts = names.map((n) =>
          Math.min(
            100,
            Math.max(10, db.jobs.filter((j) => j.area === n).length * 17),
          ),
        );
        return shell(
          "Аналитика",
          uniNav,
          `<div class="analytics-tools"><details class="toolselect" ontoggle="if(this.open)document.querySelectorAll('details.toolselect').forEach(d=>{if(d!==this)d.open=false})"><summary class="tool" aria-label="Год выпуска">Выпуск: <b>${year}</b>${ico("chevron")}</summary><div class="tool-menu">${years.map((y) => `<button type="button" class="tool-option ${y === year ? "active" : ""}" onclick="setAna('anaYear','${y}')">${y}</button>`).join("")}</div></details><details class="toolselect" ontoggle="if(this.open)document.querySelectorAll('details.toolselect').forEach(d=>{if(d!==this)d.open=false})"><summary class="tool" aria-label="Направление">Направление: <b>${dir}</b>${ico("chevron")}</summary><div class="tool-menu">${dirs.map((d) => `<button type="button" class="tool-option ${d === dir ? "active" : ""}" onclick="setAna('anaDir','${d}')">${esc(d)}</button>`).join("")}</div></details></div><div class="analytics-grid"><div class="panel"><div class="row" style="gap:22px"><div class="donut" style="--p:${rate}%;--p2:${Math.min(100, rate + searchPct)}%"><div><b>${rate}%</b><small>трудоустроены</small></div></div><div class="legend"><div><span class="dot" style="background:#2856c5"></span>Трудоустроено — <span class="num">${rate}%</span></div><div><span class="dot" style="background:#b9cdf5"></span>В поиске — <span class="num">${searchPct}%</span></div><div><span class="dot" style="background:#e5ebf6"></span>Не определились — <span class="num">${undecidedPct}%</span></div></div></div></div><div class="panel"><h3 style="margin-bottom:18px">Трудоустройство по направлениям</h3><div class="hbars">${names.map((n, i) => `<div class="hbar"><span>${n}</span><span class="track"><i style="width:${pcts[i]}%"></i></span><b>${pcts[i]}%</b></div>`).join("")}</div></div></div>`,
        );
      }
      function render() {
        header();
        let p = (location.hash.slice(1) || "home").split("?")[0];
        let protectedRoutes = [
          "graduate",
          "resume",
          "applications",
          "history",
          "profile",
          "employer",
          "employer-jobs",
          "create-job",
          "candidates",
          "candidate",
          "university",
          "graduates",
          "analytics",
        ];
        if (protectedRoutes.includes(p) && !me()) {
          document.getElementById("app").innerHTML = auth(false);
          return;
        }
        const onlyGrad = ["graduate", "resume", "applications", "profile"];
        const onlyEmp = [
          "employer",
          "employer-jobs",
          "create-job",
          "candidates",
          "candidate",
        ];
        const onlyUni = ["university", "graduates", "analytics"];
        if (
          (onlyGrad.includes(p) && role() !== "graduate") ||
          (onlyEmp.includes(p) && role() !== "employer") ||
          (onlyUni.includes(p) && role() !== "university") ||
          (p === "history" && !["graduate", "university"].includes(role()))
        ) {
          p =
            role() === "graduate"
              ? "graduate"
              : role() === "employer"
                ? "employer"
                : "university";
          if (location.hash.slice(1) !== p) {
            history.replaceState(null, "", "#" + p);
          }
        }
        let map = {
          home,
          register: () => auth(true),
          login: () => auth(false),
          graduate,
          jobs,
          job,
          resume,
          applications,
          history,
          profile,
          employer,
          "employer-jobs": employerJobs,
          "create-job": createJob,
          candidates,
          candidate,
          companies,
          university,
          graduates,
          analytics,
        };
        document.getElementById("app").innerHTML = (map[p] || home)();
        window.scrollTo(0, 0);
      }
      window.addEventListener("hashchange", render);
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".toolselect"))
          document
            .querySelectorAll("details.toolselect[open]")
            .forEach((d) => (d.open = false));
      });
      const originalRender = render;
      render = function () {
        originalRender();
        if (
          (location.hash || "").includes("analytics") &&
          typeof Chart !== "undefined"
        ) {
          const canvas = document.getElementById("jobsChart");
          if (canvas) {
            canvas.style.display = "block";
            document.getElementById("fallbackBars").style.display = "none";
            if (window.ucChart) window.ucChart.destroy();
            const labels = [
              "Разработка ПО",
              "Data Science",
              "DevOps",
              "Тестирование (QA)",
            ];
            window.ucChart = new Chart(canvas, {
              type: "bar",
              data: {
                labels,
                datasets: [
                  {
                    label: "Вакансии",
                    data: labels.map(
                      (n) => db.jobs.filter((j) => j.area === n).length,
                    ),
                    backgroundColor: "#2f63c9",
                    borderRadius: 5,
                  },
                ],
              },
              options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
              },
            });
          }
        }
      };
      document.getElementById("app").innerHTML =
        '<div class="wrap panel"><h2>Загрузка UniCareer…</h2><p>Подключаемся к базе данных.</p></div>';
      fetch("/api/state")
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((serverData) => {
          if (serverData.users && serverData.jobs) {
            const session = db.current;
            const localResume = db.resume || {};
            const localUsers = db.users || [];
            db = {
              ...db,
              ...serverData,
              current: session,
              users: [
                ...(serverData.users || []),
                ...localUsers.filter(
                  (u) =>
                    !(serverData.users || []).some(
                      (v) => v.email.toLowerCase() === u.email.toLowerCase(),
                    ),
                ),
              ],
              resume: { ...localResume, ...(serverData.resume || {}) },
            };
            demoUsers.forEach((u) => {
              const i = db.users.findIndex(
                (v) => String(v.email).toLowerCase() === u.email,
              );
              if (i < 0) db.users.push({ ...u });
              else db.users[i] = { ...db.users[i], ...u };
            });
            normalizeJuniorJobs();
            persistLocal();
            render();
          } else {
            save();
          }
        })
        .catch(() =>
          msg("Сервер недоступен: данные будут сохранены только в браузере"),
        )
        .finally(() => render());
    </script>
  </body>
</html>
